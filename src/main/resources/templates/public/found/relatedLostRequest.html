<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/publicBase}">
<head>
    <title layout:fragment="title">Liste des Objets Perdus relatifs</title>
</head>
<body>
<div layout:fragment="content" class="col-xxl-10 container-fluid" style="margin: 125px 0;">
    <h1 class="text-center" style="margin-bottom: 20px;">Liste des Objets Perdus correspondant à votre demande</h1>
    <div class="row">
        <div class="col-xxl-6" th:each="lost : ${relatedLostList}">
            <div class="card">
                <div class="row g-0">
                    <div class="col-md-4">
                        <img class="rounded-start img-fluid h-100 object-fit-cover"
                             th:src="@{/images/objects_images.jpg}" alt="Card image">
                    </div>
                    <div class="col-md-8">
                        <div class="card-header">
                            <h5 class="card-title mb-0" th:text="${lost.name}">Name</h5>
                        </div>
                        <div class="card-body">
                            <p class="card-text mb-2" th:text="${lost.description}">For that very reason, I went on
                                a quest and spoke to many different professional graphic designers and asked them
                                what graphic design tips they live.</p>
                            <p class="card-text"><small class="text-muted" th:text="${lost.createdAt}">Last updated
                                3 mins ago</small></p>
                            <a th:href="@{/found/connect/{lostCode}(lostCode=${lost.code})}" class="w-100 btn btn-primary waves-effect waves-light">Demander une mise en relation</a>

                        </div>
                    </div>
                </div>

            </div><!-- end card -->
        </div><!-- end row -->
    </div>
</div>

</body>
</html>
