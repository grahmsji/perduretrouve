<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
      data-sidebar-image="none" data-preloader="disable" data-theme="default" data-theme-colors="default">

<head>

    <meta charset="utf-8" />
    <title layout:title-pattern="$CONTENT_TITLE">My Site</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
    <meta content="Themesbrand" name="author" />

    <!-- Table style -->
    <link rel="stylesheet" href="../../../../cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css" />
    <!--datatable responsive css-->
    <link rel="stylesheet" href="../../../../cdn.datatables.net/responsive/2.2.9/css/responsive.bootstrap.min.css" />

    <link rel="stylesheet" href="../../../../cdn.datatables.net/buttons/2.2.2/css/buttons.dataTables.min.css">
    <!-- End Style -->
    <!-- App favicon -->
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}">

    <!-- Sweet Alert css-->
    <link th:href="@{/libs/sweetalert2/sweetalert2.min.css}" rel="stylesheet"
          type="text/css" />

    <!-- jsvectormap css -->
    <link th:href="@{/libs/jsvectormap/css/jsvectormap.min.css}" rel="stylesheet"
          type="text/css" />

    <!--Swiper slider css-->
    <link th:href="@{/libs/swiper/swiper-bundle.min.css}" rel="stylesheet"
          type="text/css" />

    <!-- Layout config Js -->
    <script th:src="@{/js/layout.js}"></script>
    <!-- Bootstrap Css -->
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link th:href="@{/css/icons.min.css}" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link th:href="@{/css/app.min.css}" rel="stylesheet" type="text/css" />
    <!-- custom Css-->
    <link th:href="@{/css/custom.min.css}" rel="stylesheet" type="text/css" />

</head>

<body>

<!-- Begin page -->
<div id="layout-wrapper">

    <header id="page-topbar">
        <div class="layout-width">
            <div class="navbar-header">
                <div class="d-flex">
                    <!-- LOGO -->
                    <div class="navbar-brand-box horizontal-logo">
                        <a href="#" class="logo logo-dark">
                                <span class="logo-sm">

                                </span>
                            <span class="logo-lg">

                                </span>
                        </a>

                        <a href="#" class="logo logo-light">
                                <span class="logo-sm">

                                </span>
                            <span class="logo-lg">

                                </span>
                        </a>
                    </div>

                    <button type="button"
                            class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger"
                            id="topnav-hamburger-icon">
                            <span class="hamburger-icon">
                                <span></span>
                                <span></span>
                                <span></span>
                            </span>
                    </button>


                </div>

                <div class="d-flex align-items-center">

                    <div class="dropdown d-md-none topbar-head-dropdown header-item">
                        <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                                id="page-header-search-dropdown" data-bs-toggle="dropdown" aria-haspopup="true"
                                aria-expanded="false">
                            <i class="bx bx-search fs-22"></i>
                        </button>
                        <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0"
                             aria-labelledby="page-header-search-dropdown">
                            <form class="p-3">
                                <div class="form-group m-0">
                                    <div class="input-group">
                                        <input type="text" class="form-control" placeholder="Search ..."
                                               aria-label="Recipient's username">
                                        <button class="btn btn-primary" type="submit"><i
                                                class="mdi mdi-magnify"></i></button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="ms-1 header-item d-none d-sm-flex">
                        <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                                data-toggle="fullscreen">
                            <i class='bx bx-fullscreen fs-22'></i>
                        </button>
                    </div>

                    <div class="ms-1 header-item d-none d-sm-flex">
                        <button type="button"
                                class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle light-dark-mode">
                            <i class='bx bx-moon fs-22'></i>
                        </button>
                    </div>



                    <div class="dropdown ms-sm-3 header-item topbar-user">
                        <button type="button" class="btn" id="page-header-user-dropdown" data-bs-toggle="dropdown"
                                aria-haspopup="true" aria-expanded="false">
                                <span class="d-flex align-items-center">
                                    <div
                                            class="rounded-circle header-profile-user d-flex align-items-center justify-content-center"
                                            style="width: 40px; height: 40px; background: rgb(191, 188, 197); font-size: 20px; "
                                    >
                                        AD
                                    </div>
                                    <span class="text-start ms-xl-2">
                                        <span class="d-none d-xl-inline-block ms-1 fw-semibold user-name-text">Administrateur</span>
                                        <span class="d-none d-xl-block ms-1 fs-12 user-name-sub-text">Admin</span>
                                    </span>
                                </span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end">
                            <!-- item-->
                            <h6 class="dropdown-header">Bienvenue !</h6>

                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" th:href="@{/}"><i
                                    class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i> <span
                                    class="align-middle" data-key="t-logout">Logout</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>


    <!-- ========== App Menu ========== -->
    <div class="app-menu navbar-menu">
        <!-- LOGO -->
        <div class="navbar-brand-box">
            <!-- Dark Logo-->
            <a href="#" class="logo logo-dark">
                    <span class="logo-sm">

                    </span>
                <span class="logo-lg">

                    </span>
            </a>
            <!-- Light Logo-->
            <a class="navbar-brand display-6 fw-bold text-capitalize lh-base fs-24 " href=""
               style="color: white; padding-top: 15px;">

            </a>
            <button type="button" class="btn btn-sm p-0 fs-17 header-item float-end btn-vertical-sm-hover"
                    id="vertical-hover">
                <i class="ri-record-circle-line"></i>
            </button>
        </div>


        <div id="scrollbar" class="h-100 simplebar-scrollable-y" data-simplebar="init">
            <div class="container-fluid">

                <div id="two-column-menu">
                </div>
                <ul class="navbar-nav" id="navbar-nav">
                    <li class="menu-title fs-24" style="padding-left: 5px;"><span data-key="t-menu">DASHBOARD</span></li>

                    <li class="nav-item">
                        <a class="nav-link menu-link" href="#sidebarUniversite" data-bs-toggle="collapse"
                           role="button" aria-expanded="false" aria-controls="sidebarUniversite">
                            <i class="ri-graduation-cap-line"></i> <span data-key="t-landing">Catégories</span>
                        </a>
                        <div class="collapse menu-dropdown" id="sidebarUniversite">

                            <ul class="nav nav-sm flex-column">

                                <li class="nav-item">
                                    <a th:href="@{/admins/category/}" class="nav-link"
                                       data-key="t-one-page">Liste des catégories</a>
                                </li>
                                <li class="nav-item">
                                    <a th:href="@{/admins/category/create}" class="nav-link"
                                       data-key="t-nft-landing">Créer une Catégorie</a>
                                </li>
                            </ul>
                        </div>
                    </li>


                    <li class="nav-item">
                        <a class="nav-link menu-link" href="#sidebarEcole" data-bs-toggle="collapse" role="button"
                           aria-expanded="false" aria-controls="sidebarEcole">
                            <i class="ri-school-line"></i> <span data-key="t-landing">Mise en relation</span>
                        </a>
                        <div class="collapse menu-dropdown" id="sidebarEcole">

                            <ul class="nav nav-sm flex-column">

                                <li class="nav-item">
                                    <a th:href="@{/admins/connect/}" class="nav-link"
                                       data-key="t-one-page">Mise en relations</a>
                                </li>

                            </ul>
                        </div>
                    </li>


                </ul>
            </div>
            <!-- Sidebar -->
        </div>

        <div class="sidebar-background"></div>
    </div>
    <!-- Left Sidebar End -->
    <!-- Vertical Overlay-->
    <div class="vertical-overlay"></div>

    <!-- ============================================================== -->
    <!-- Start right Content here -->
    <!-- ============================================================== -->
    <div class="main-content">
        <div class="page-content">
            <div class="container-fluid" layout:fragment="content">

            </div>

        </div>

        <!-- End Page-content -->

        <footer class="footer">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-sm-6">
                        <script>document.write(new Date().getFullYear())</script> © .
                    </div>
                    <div class="col-sm-6">
                        <div class="text-sm-end d-none d-sm-block">
                            Design & Develop by Retrivio Team
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <!-- end main content-->

</div>
<!-- END layout-wrapper -->



<!--start back-to-top-->
<button onclick="topFunction()" class="btn btn-danger btn-icon" id="back-to-top">
    <i class="ri-arrow-up-line"></i>
</button>
<!--end back-to-top-->



<!-- JAVASCRIPT -->
<script th:src="@{/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/libs/simplebar/simplebar.min.js}"></script>
<script th:src="@{/libs/node-waves/waves.min.js}"></script>
<script th:src="@{/libs/feather-icons/feather.min.js}"></script>
<script th:src="@{/js/pages/plugins/lord-icon-2.1.0.js}"></script>
<script th:src="@{/js/plugins.js}"></script>

<!-- apexcharts -->
<script th:src="@{/libs/apexcharts/apexcharts.min.js}"></script>

<!-- Vector map-->
<script th:src="@{/libs/jsvectormap/js/jsvectormap.min.js}"></script>
<script th:src="@{/libs/jsvectormap/maps/world-merc.js}"></script>

<!--Swiper slider js-->
<script th:src="@{/libs/swiper/swiper-bundle.min.js}"></script>

<!-- Dashboard init -->
<script th:src="@{/js/pages/dashboard-ecommerce.init.js}"></script>

<!-- App js -->
<script th:src="@{/js/app.js}"></script>
<!-- AlerBox -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<!-- Table js -->
<script src="../../../../code.jquery.com/jquery-3.6.0.min.js"
        integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>

<!--datatable js-->

<script src="../../../../cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="../../../../cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="../../../../cdn.datatables.net/responsive/2.2.9/js/dataTables.responsive.min.js"></script>
<script src="../../../../cdn.datatables.net/buttons/2.2.2/js/dataTables.buttons.min.js"></script>
<script src="../../../../cdn.datatables.net/buttons/2.2.2/js/buttons.print.min.js"></script>
<script src="../../../../cdn.datatables.net/buttons/2.2.2/js/buttons.html5.min.js"></script>
<script src="../../../../cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
<script src="../../../../cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
<script src="../../../../cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>

<script th:src="@{/js/pages/datatables.init.js}"></script>


</body>
